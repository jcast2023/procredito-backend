<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>ProCrédito</h1>
      <p>Sistema de Gestión de Microcréditos</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          name="username"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          placeholder="admin"
          autocomplete="username"
          [disabled]="cargando()"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-with-icon">
          <input
            id="password"
            [type]="mostrarPassword() ? 'text' : 'password'"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="cargando()"
            required
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="toggleMostrarPassword()"
            [disabled]="cargando()"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [title]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarPassword()) {
              <!-- Ícono ojo abierto (visible) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <!-- Ícono ojo cerrado (oculto) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-message">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="btn-login"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>

    <div class="login-footer">
      <small>Usuarios de prueba: admin / admin123</small>
      <a routerLink="/recuperar" class="link-recuperar">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>
