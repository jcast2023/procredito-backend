<div class="layout" [class.sidebar-collapsed]="!menuAbierto()">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg lucideBanknote [size]="28" [strokeWidth]="2.5"></svg>
        </div>
        @if (menuAbierto()) {
          <span class="logo-text">ProCrédito</span>
        }
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-item"
        [title]="menuAbierto() ? '' : 'Dashboard'"
      >
        <svg lucideLayoutDashboard [size]="20"></svg>
        @if (menuAbierto()) {
          <span class="nav-label">Dashboard</span>
        }
      </a>

      <a
        routerLink="/clientes"
        routerLinkActive="active"
        class="nav-item"
        [title]="menuAbierto() ? '' : 'Clientes'"
      >
        <svg lucideUsers [size]="20"></svg>
        @if (menuAbierto()) {
          <span class="nav-label">Clientes</span>
        }
      </a>

      <a
        routerLink="/solicitudes"
        routerLinkActive="active"
        class="nav-item"
        [title]="menuAbierto() ? '' : 'Solicitudes'"
      >
        <svg lucideFileText [size]="20"></svg>
        @if (menuAbierto()) {
          <span class="nav-label">Solicitudes</span>
        }
      </a>
    </nav>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main-area">

    <!-- HEADER -->
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleMenu()" title="Mostrar/Ocultar menú">
        <svg lucideMenu [size]="22"></svg>
      </button>

      <div class="topbar-title">
        <h2>Panel de Control</h2>
      </div>

      <div class="topbar-user">
        @if (usuario(); as u) {
          <div class="user-info">
            <span class="user-name">{{ u.nombreCompleto }}</span>
            <span class="user-role">{{ u.rol }}</span>
          </div>
        }
        <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
          <svg lucideLogOut [size]="16"></svg>
          <span>Salir</span>
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
