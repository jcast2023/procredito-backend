<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>ProCrédito</h1>
      <p>Nueva contraseña</p>
    </div>

    @if (!exito()) {
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="token">Código de verificación</label>
          <input
            id="token"
            type="text"
            name="token"
            [ngModel]="token()"
            (ngModelChange)="token.set($event)"
            placeholder="Ingrese el código del correo"
            [disabled]="cargando()"
            required
          />
        </div>

        <div class="form-group">
          <label for="nuevaPassword">Nueva contraseña</label>
          <div class="input-with-icon">
            <input
              id="nuevaPassword"
              [type]="mostrarPassword() ? 'text' : 'password'"
              name="nuevaPassword"
              [ngModel]="nuevaPassword()"
              (ngModelChange)="nuevaPassword.set($event)"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              [disabled]="cargando()"
              required
            />
            <button
              type="button"
              class="btn-toggle-password"
              (click)="toggleMostrarPassword()"
              [disabled]="cargando()"
            >
              @if (mostrarPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              }
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input
            id="confirmarPassword"
            [type]="mostrarPassword() ? 'text' : 'password'"
            name="confirmarPassword"
            [ngModel]="confirmarPassword()"
            (ngModelChange)="confirmarPassword.set($event)"
            placeholder="Repita la contraseña"
            autocomplete="new-password"
            [disabled]="cargando()"
            required
          />
        </div>

        @if (error()) {
          <div class="error-message">
            {{ error() }}
          </div>
        }

        <button type="submit" class="btn-login" [disabled]="cargando()">
          @if (cargando()) {
            Guardando...
          } @else {
            Restablecer contraseña
          }
        </button>

        <button type="button" class="btn-link" (click)="irAlLogin()" [disabled]="cargando()">
          ← Volver al inicio de sesión
        </button>
      </form>
    } @else {
      <div class="success-box">
        <p>¡Contraseña actualizada correctamente!</p>
        <button type="button" class="btn-login" (click)="irAlLogin()">
          Iniciar sesión
        </button>
      </div>
    }
  </div>
</div>
