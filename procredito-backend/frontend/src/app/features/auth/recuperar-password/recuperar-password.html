<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>ProCrédito</h1>
      <p>Recuperar contraseña</p>
    </div>

    @if (!enviado()) {
      <form (ngSubmit)="onSubmit()" class="login-form">
        <p class="info-text">
          Ingrese el correo con el que se registró. Le enviaremos un código de verificación.
        </p>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            name="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            placeholder="usuario@correo.com"
            autocomplete="email"
            [disabled]="cargando()"
            required
          />
        </div>

        @if (error()) {
          <div class="error-message">
            {{ error() }}
          </div>
        }

        <button type="submit" class="btn-login" [disabled]="cargando()">
          @if (cargando()) {
            Enviando...
          } @else {
            Enviar código
          }
        </button>

        <button type="button" class="btn-link" (click)="irAlLogin()" [disabled]="cargando()">
          ← Volver al inicio de sesión
        </button>
      </form>
    } @else {
      <div class="success-box">
        <p>
          Si el correo existe, recibirá un código de verificación.
        </p>

        <!-- NUEVO: botón para ir al paso de confirmación -->
        <button type="button" class="btn-login" (click)="irAConfirmar()">
          Ya tengo el código
        </button>

        <button type="button" class="btn-link" (click)="irAlLogin()">
          ← Volver al inicio de sesión
        </button>
      </div>
    }
  </div>
</div>
